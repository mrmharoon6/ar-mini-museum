<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Museum AR - Red Fox Exhibit</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    // tapping the orb cycles through these colours
    AFRAME.registerComponent('color-changer', {
      init: function () {
        const colors = ['#E63946', '#FFB703', '#4CC3D9', '#7BC8A4', '#9B59B6'];
        let index = 0;
        this.el.addEventListener('click', () => {
          index = (index + 1) % colors.length;
          this.el.setAttribute('color', colors[index]);
        });
      }
    });

    // tapping the cone shows / hides the fact card
    AFRAME.registerComponent('info-toggle', {
      schema: { target: { type: 'selector' } },
      init: function () {
        this.el.addEventListener('click', () => {
          const card = this.data.target;
          if (!card) return;
          const isVisible = card.getAttribute('visible');
          card.setAttribute('visible', !isVisible);
        });
      }
    });

    // updates the banner at the top when the marker is found or lost
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.querySelector('#status');

        this.el.addEventListener('markerFound', () => {
          banner.textContent = 'Marker found - tap the orb or the yellow cone';
          banner.style.background = '#2E7D32';
        });

        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Marker lost - point the camera at the Hiro marker';
          banner.style.background = '#C62828';
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 999;
      padding: 10px; text-align: center; color: white;
      font-family: sans-serif; font-size: 16px; background: #C62828;
    }
  </style>
</head>

<body>
  <div id="status">Looking for marker...</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-assets timeout="20000">
      <a-asset-item id="fox-model"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Fox/glTF-Binary/Fox.glb">
      </a-asset-item>
    </a-assets>

    <a-marker preset="hiro" marker-status>

      <!-- museum floor -->
      <a-plane rotation="-90 0 0" width="1.6" height="1.6" color="#2B2D42"></a-plane>

      <!-- plinth -->
      <a-cylinder position="0 0.05 0" radius="0.5" height="0.1" color="#8D99AE"></a-cylinder>

      <!-- the fox, slowly turning on the plinth -->
      <a-entity gltf-model="#fox-model" position="0 0.1 0" scale="0.005 0.005 0.005"
                animation="property: rotation; to: 0 360 0;
                           dur: 12000; easing: linear; loop: true"></a-entity>

      <!-- title -->
      <a-text value="THE RED FOX" position="0 0.85 0" align="center"
              width="3" color="#FFFFFF"></a-text>

      <!-- little tilted placard at the front -->
      <a-box position="0 0.1 0.65" rotation="-35 0 0"
             width="0.9" height="0.2" depth="0.04" color="#F1FAEE">
        <a-text value="Exhibit 01 - Vulpes vulpes" position="0 0 0.025" align="center"
                width="0.8" wrap-count="26" color="#1D3557"></a-text>
      </a-box>

      <!-- tappable bouncing orb (colour changes on tap) -->
      <a-sphere class="clickable" color-changer
                position="0.65 0.6 0" radius="0.15" color="#E63946"
                animation="property: position; from: 0.65 0.45 0; to: 0.65 0.85 0;
                           dir: alternate; dur: 800;
                           easing: easeInOutQuad; loop: true"></a-sphere>

      <!-- tappable cone, toggles the fact card -->
      <a-cone class="clickable" info-toggle="target: #fact-card"
              position="-0.6 0.15 0.5" radius-bottom="0.12" radius-top="0" height="0.3"
              color="#FFB703"
              animation="property: scale; from: 1 1 1; to: 1.25 1.25 1.25;
                         dir: alternate; dur: 700; loop: true"></a-cone>

      <!-- fact card, hidden until the cone is tapped -->
      <a-plane id="fact-card" visible="false" position="0 1.35 0"
               width="1.5" height="0.6" color="#1D3557">
        <a-text value="The red fox has one of the widest ranges of any wild carnivore. Its bushy tail is called a brush."
                position="0 0 0.01" align="center" width="1.3" wrap-count="30"
                color="#FFFFFF"></a-text>
      </a-plane>

    </a-marker>

    <a-entity camera
              cursor="rayOrigin: mouse"
              raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
